# Deux façons de lancer, en une commande :
#
#   A) Machine vierge (tout dans Docker, ~6 Go de RAM pour Docker conseillés) :
#        docker compose --profile ollama up -d --build
#
#   B) Ollama déjà installé sur le PC (plus léger, recommandé si peu de RAM) :
#        dans .env :  OLLAMA_URL=http://host.docker.internal:11434
#        docker compose up -d --build
#
#   Interface : http://localhost:8501      API : http://localhost:8000/docs
#   Ports et modèle modifiables dans un fichier .env (voir .env.example).

services:
  # --- Base PostgreSQL de démo (pg_stat_statements + HypoPG) ---
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 côté PC pour ne pas gêner un PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- LLM local (option A : seulement avec --profile ollama) ---
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Télécharge le modèle une seule fois (gardé dans le volume « ollama »), puis s'arrête.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5-coder:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- L'agent (API FastAPI) ---
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://agent_ro:agent_ro@db:5432/shop   # rôle LECTURE SEULE
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # accès à l'Ollama du PC (option B), aussi sous Linux
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false   # absent en option B : on n'attend pas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Interface web ---
  ui:
    build: .
    command: ["streamlit", "run", "src/sql_agent/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
